<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lấy lại mật khẩu — Changie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/auth-style.css">
</head>
<body>
<div class="dc-shell">
  <div class="dc-side">
    <div class="dc-logo">TD<span>.</span></div>
    <div class="dc-hero">
      <h1>Lấy lại mật khẩu</h1>
      <p>Chỉ ba bước<br>để trở lại hành trình</p>
    </div>
  </div>

  <div class="dc-panel">
    <form class="dc-form" id="wizard">
      <div class="dc-progress" id="progress">
        <span class="is-active"></span><span></span><span></span>
      </div>
      <p class="dc-step-eyebrow" id="step-label">Bước 1 / 3</p>
      <h2 class="dc-step-title" id="step-title">Xác minh số điện thoại</h2>
      <p class="dc-step-hint" id="step-hint">Nhập số điện thoại đã dùng để đăng ký, chúng tôi sẽ gửi mã xác thực qua SMS.</p>

      <!-- step 0: phone -->
      <div class="dc-field" data-step="0">
        <label for="fp-phone">Số điện thoại</label>
        <input class="dc-input dc-input--accent" id="fp-phone" type="tel" placeholder="0912 345 678">
      </div>

      <!-- step 1: otp code -->
      <div data-step="1" hidden>
        <label>Mã xác thực</label>
        <div class="dc-code-row" id="code-row">
          <input class="dc-code-box" inputmode="numeric" maxlength="1">
          <input class="dc-code-box" inputmode="numeric" maxlength="1">
          <input class="dc-code-box" inputmode="numeric" maxlength="1">
          <input class="dc-code-box" inputmode="numeric" maxlength="1">
          <input class="dc-code-box" inputmode="numeric" maxlength="1">
          <input class="dc-code-box" inputmode="numeric" maxlength="1">
        </div>
        <p class="dc-msg dc-msg--hint">Chưa nhận được mã ? <a href="#" id="link-resend">Gửi lại</a></p>
      </div>

      <!-- step 2: new password -->
      <div data-step="2" hidden>
        <label for="fp-new">Mật khẩu mới</label>
        <div class="dc-pass-wrap">
          <input class="dc-input" id="fp-new" type="password" placeholder="Ít nhất 8 ký tự">
          <button class="dc-eye-btn" type="button" id="btn-eye" aria-label="Hiện mật khẩu">
            <span class="dc-eye-ring"><span class="dc-eye-dot"></span></span>
          </button>
        </div>
        <div class="dc-field">
          <label for="fp-new2">Nhập lại mật khẩu mới</label>
          <input class="dc-input" id="fp-new2" type="password" placeholder="Nhập lại mật khẩu">
        </div>
      </div>

      <!-- step 3: done -->
      <div class="dc-done" data-step="3" hidden>
        <span class="dc-done-icon">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0d6efd" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"></path></svg>
        </span>
        <p>Mật khẩu đã được cập nhật. Bạn có thể đăng nhập bằng mật khẩu mới.</p>
      </div>

      <div id="msg" class="dc-msg" hidden></div>

      <button class="dc-btn dc-btn-primary" type="submit" id="btn-next">Gửi mã xác thực</button>
      <p class="dc-footer"><a href="#" id="link-back">Quay lại đăng nhập</a></p>
    </form>
  </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/auth-client.js"></script>
<script src="../js/quenmatkhau.js"></script>
</body>
</html>
