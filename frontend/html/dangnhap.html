<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/auth-style.css">
</head>
<body>
<div class="dc-shell">
  <div class="dc-side">
    <div class="dc-logo">TD<span>.</span></div>
    <div class="dc-hero">
      <h1>Đăng nhập tài khoản</h1>
      <p>Tiếp tục hành trình<br>tri thức cùng tôi</p>
    </div>
  </div>

  <div class="dc-panel">
    <form class="dc-form" id="form-login">
      <div class="dc-field">
        <label for="phone">Số điện thoại</label>
        <input class="dc-input dc-input--accent" id="phone" type="tel" placeholder="0912 345 678" required>
      </div>

      <div class="dc-field">
        <label for="password">Mật khẩu</label>
        <div class="dc-pass-wrap">
          <input class="dc-input" id="password" type="password" placeholder="Nhập mật khẩu của bạn" required>
          <button class="dc-eye-btn" type="button" id="btn-eye" aria-label="Hiện mật khẩu">
            <span class="dc-eye-ring"><span class="dc-eye-dot"></span></span>
          </button>
        </div>
      </div>

      <p class="dc-forgot-row"><a href="quenmatkhau.html">Quên mật khẩu ?</a></p>

      <div id="msg" class="dc-msg" hidden></div>

      <button class="dc-btn dc-btn-primary" type="submit" id="btn-submit">Đăng nhập</button>

      <!-- UC-01/UC-02 luồng 3a: đăng nhập = đăng ký bằng Google (tài khoản chưa có thì tự tạo) — js/google-login.js -->
      <button class="dc-btn dc-btn-google" type="button" id="btn-google" data-msg="msg">
        <span class="dc-google-dot"><span></span></span>
        <span class="dc-google-label">Tiếp tục với Google</span>
      </button>

      <p class="dc-footer">Chưa có tài khoản ? <a href="dangky.html">Đăng ký</a></p>
    </form>
  </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/auth-client.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="../js/google-login.js"></script>
<script src="../js/dangnhap.js"></script>
</body>
</html>
