<body>

  <div class="top-band">
    <header class="nav">
      <a class="logo" href="#">
        <span class="logo-key">T</span><span class="logo-key">D</span>
      </a>
      <div class="nav-auth">
        <a class="btn-outline" href="dangky.html">Đăng ký</a>
      </div>
    </header>

    <div class="wrap hero">
      <h1 class="headline">Chào mừng bạn đến với thế giới<br>tri thức</h1>

      <div class="process">
        <div class="process-step">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 13.5 L3 10 L11 2 L14 5 L6 13 Z"/><path d="M9 4 L12 7"/></svg>
          Ghi chú bài học
        </div>
        <div class="process-divider"></div>
        <div class="process-step">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 1 L9.6 5.8 L14.5 6.6 L11 10 L11.9 15 L8 12.6 L4.1 15 L5 10 L1.5 6.6 L6.4 5.8 Z"/></svg>

        </div>
        <div class="process-divider"></div>
        <div class="process-step">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 3h12M2 8h12M2 13h8"/><path d="M12 11l1.5 1.5L16 10"/></svg>

        </div>
        <a class="btn-solid" href="dangnhap.html">Bắt đầu miễn phí</a>
      </div>
    </div>
  </div>

  <main>
    <section class="cards">
      <article class="card card--left">
        <h3>Ý tưởng vào nếp, đầu óc nhẹ&nbsp;tênh</h3>
        <div class="illus"><img src="../assets/card-note.svg" alt=""></div>
      </article>

      <article class="card card--mid">
        <h3>Hỏi gì cũng đáp, quiz gì cũng ra</h3>
        <div class="illus"><img src="../assets/card-quiz.svg" alt=""></div>
      </article>

      <article class="card card--right">
        <h3>Lịch học rõ ràng, deadline hết lo</h3>
        <div class="illus"><img src="../assets/card-schedule.svg" alt=""></div>
      </article>
    </section>
  </main>
